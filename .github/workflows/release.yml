name: Release

# On every push to prime, Changesets either opens/updates a "Version Packages" PR
# (when unreleased changesets exist) or, once that PR is merged, publishes to npm.
# Publishing uses npm Trusted Publishing (OIDC), so no npm token is stored here.

on:
  push:
    branches: [prime]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npm run release
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
